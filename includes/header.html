<style>
    .nav-links a {
        transition: all 0.2s ease;
        display: inline-block;
        padding-bottom: 4px;
        border-bottom: 2.5px solid transparent;
    }
    .nav-links a:hover {
        -webkit-text-stroke: 0.8px #967451; 
        text-shadow: 0 0 1px #967451;
    }
</style>

<header class="navbar" style="background-color: #FFF8E7; padding: 15px 40px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 6px rgba(0,0,0,0.05); width: 100vw; margin-left: calc(50% - 50vw); margin-top: -35px; box-sizing: border-box; position: sticky; top: 0; z-index: 1000;">
    <div class="logo" style="display: flex; align-items: center; gap: 15px;">
        <img src="./assets/images/logo.png" alt="Mộc Miên Garden Logo" style="height: 50px; width: auto; mix-blend-mode: multiply;">
        <a href="index.html" style="color: #808000; font-size: 26px; font-weight: bold; text-decoration: none; font-family: serif; letter-spacing: 1px;">MỘC MIÊN</a>
    </div>
    
    <nav>
        <ul class="nav-links" style="list-style: none; display: flex; gap: 25px; margin: 0; padding: 0; font-family: sans-serif; font-size: 15px;">
            <li><a href="index.html" style="color: #967451; text-decoration: none; font-weight: bold;">Trang chủ</a></li>
            <li><a href="products.html" style="color: #967451; text-decoration: none; font-weight: bold;">Sản phẩm</a></li>
            <li><a href="blog.html" style="color: #967451; text-decoration: none; font-weight: bold;">Blog</a></li>
            <li><a href="about.html" style="color: #967451; text-decoration: none; font-weight: bold;">Giới thiệu</a></li>
            <li><a href="contact.html" style="color: #967451; text-decoration: none; font-weight: bold;">Liên hệ</a></li>
        </ul>
    </nav>

    <div class="header-actions" style="display: flex; gap: 20px; align-items: center;">
        <a href="wishlist.html" title="Yêu thích" style="text-decoration: none;">
            <svg width="25" height="25" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M14 24S3 17 3 9.5A5.5 5.5 0 0 1 14 7.22 5.5 5.5 0 0 1 25 9.5C25 17 14 24 14 24Z" 
                 stroke="#7a5c3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            </svg>
        </a>

        <a href="cart.html" title="Giỏ hàng" style="position: relative; text-decoration: none;">
           <svg id="cart-svg-icon" width="35" height="30" viewBox="0 0 28 28" overflow="visible" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M2 2H6L9 18H22L25 7H7" stroke="#7a5c3a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="11" cy="22" r="2" fill="#7a5c3a"/>
                <circle cx="20" cy="22" r="2" fill="#7a5c3a"/>
                <circle id="cart-badge-bg" cx="26" cy="2" r="7" fill="#808000" style="display:none"/>
                <text id="cart-badge-text" x="26" y="6" text-anchor="middle" font-size="9" font-weight="750" fill="white" font-family = "'Montserrat', sans-serif" style="display:none">0</text>
            </svg>
        </a>
    </div>
</header>

<svg style="display:none" onload="
    setTimeout(() => {
        const currentUrl = window.location.href;
        const currentPath = window.location.pathname;
        const links = document.querySelectorAll('.nav-links a');
        
        links.forEach(link => {
            const href = link.getAttribute('href');
            // Nếu URL chứa tên trang (vd: products.html) hoặc đang ở trang chủ (/)
            if (currentUrl.includes(href) || (href === 'index.html' && (currentPath.endsWith('/') || currentPath.endsWith('252IS19A01_Nhom4/')))) {
                link.style.borderBottom = '2.5px solid #967451';
                link.style.webkitTextStroke = '0.8px #967451';  
            }
        });
    }, 200);
"></svg>
<script>
    document.addEventListener('cartReady', (e) => {
        const badge = document.getElementById('cart-badge-bg');
        const text = document.getElementById('cart-badge-text');
        if (!badge || !text) return;
        const total = e.detail;
        badge.style.display = total > 0 ? 'block' : 'none';
        text.style.display = total > 0 ? 'block' : 'none';
        text.textContent = total > 99 ? '99+' : total;
    });
</script>
