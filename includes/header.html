<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
<style>
    body {
        margin: 0 !important;
        padding: 0;
    }

    .nav-links a {
        transition: all 0.2s ease;
        display: inline-block;
        padding-bottom: 0.25rem; /* 4px */
        border-bottom: 0.15rem solid transparent; /* 2.5px */
    }
    .nav-links a:hover {
        -webkit-text-stroke: 0.05rem var(--color-nau-dat); /* 0.8px */
        text-shadow: 0 0 0.0625rem var(--color-nau-dat); /* 1px */
        border-bottom-color: var(--color-nau-dat); 
    }
    .search-box:focus-within {
        border-color: var(--color-nau-dat) !important;
        box-shadow: 0 0 0 0.125rem rgba(150, 116, 81, 0.2); /* 2px */
    }
</style>

<header class="navbar" style="background-color: #FFF; padding: 1rem 2.5rem; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 6px rgba(0,0,0,0.05); width: 100%; box-sizing: border-box;">
    <div class="logo" style="display: flex; align-items: center; gap: 1rem;">
        <img src="assets/images/logo.png" alt="Mộc Miên Garden Logo" style="height: 4rem; width: auto; mix-blend-mode: multiply;">
        <a href="index.html" style="color: var(--green-oliu); font-size: 1.625rem; font-weight: bold; text-decoration: none; font-family: serif; letter-spacing: 1px;">MỘC MIÊN</a>
    </div>
    
    <nav>
        <ul class="nav-links" style="list-style: none; display: flex; gap: 1.5rem; margin: 0; padding: 0; font-family: sans-serif; font-size: 1rem;">
            <li><a href="index.html" style="color: var(--color-nau-dat); text-decoration: none; font-weight: bold;">Trang chủ</a></li>
            <li><a href="pages/products/ProductList.html" style="color: var(--color-nau-dat); text-decoration: none; font-weight: bold;">Sản phẩm</a></li>
            <li><a href="pages/blog/Blog.html" style="color: var(--color-nau-dat); text-decoration: none; font-weight: bold;">Blog</a></li>
            <li><a href="pages/info/AboutUs.html" style="color: var(--color-nau-dat); text-decoration: none; font-weight: bold;">Giới thiệu</a></li>
            <li><a href="pages/info/Contact.html" style="color: var(--color-nau-dat); text-decoration: none; font-weight: bold;">Liên hệ</a></li>
        </ul>
    </nav>

    <div class="search-box" style="display: flex; align-items: center; border: 1.5px solid var(--color-nau-dat); border-radius: 1.25rem; padding: 0.25rem 0.75rem; background: #fff; transition: all 0.3s ease;">
        <input type="text" id="searchInput" placeholder="Tìm kiếm..." onkeypress="handleSearchKeyPress(event)" style="border: none; outline: none; background: transparent; font-size: 0.875rem; width: 15rem; color: #333;">
        <button onclick="executeSearch()" style="background: none; border: none; cursor: pointer; padding: 0; display:flex; align-items:center;">
            <span class="material-symbols-outlined" style="font-size: 1.25rem; color:var(--color-nau-dat);">search</span>
        </button>
    </div>

    <div class="header-actions" style="display: flex; gap: 0.75rem; align-items: center;">
        <a href="pages/account/Wishlist.html" title="Yêu thích" style="text-decoration: none; display:flex; align-items:center;">
            <span class="material-symbols-outlined" style="font-size: 1.5rem; color:#7a5c3a;">favorite</span>
        </a>
        <a href="pages/checkout/Cart.html" title="Giỏ hàng" style="text-decoration: none; display:flex; align-items:center; position: relative;">
            <span class="material-symbols-outlined" style="font-size: 1.75rem; color:#7a5c3a; font-variation-settings:'FILL' 0,'wght' 300;">shopping_cart</span>
            <span id="cart-badge-bg" style="display:none; position:absolute; top:-6px; right:-8px; background:var(--green-oliu); color:white; border-radius:50%; width:1rem; height:1rem; font-size:0.625rem; font-weight:700; align-items:center; justify-content:center; line-height:1rem; text-align:center;">
                <span id="cart-badge-text">0</span>
            </span>
        </a>
        <a href="pages/account/Profile.html" title="Tài khoản" style="text-decoration: none; display:flex; align-items:center;">
            <span class="material-symbols-outlined" style="font-size: 1.875rem; color:#7a5c3a;">person</span>
        </a>
    </div>
</header>

<svg style="display:none" onload="
    setTimeout(() => {
        const currentUrl = window.location.href;
        const currentPath = window.location.pathname;
        const links = document.querySelectorAll('.nav-links a');
        
        links.forEach(link => {
            const href = link.getAttribute('href');
            if (currentUrl.includes(href) || (href === 'index.html' && (currentPath.endsWith('/') || currentPath.endsWith('252IS19A01_Nhom4/')))) {
                link.style.borderBottom = '0.15rem solid var(--color-nau-dat)';
                link.style.webkitTextStroke = '0.05rem var(--color-nau-dat)';  
            }
        });
    }, 200);
"></svg>

<script>
    function executeSearch() {
        const keyword = document.getElementById('searchInput').value.trim();

        if (keyword === "") {
            alert("Vui lòng nhập từ khóa bạn muốn tìm kiếm!");
            document.getElementById('searchInput').focus();
            return;
        }

        // Xác định basePath từ thẻ <base> đã được inject
        const baseEl = document.querySelector('base');
        const base = baseEl ? baseEl.getAttribute('href') : '/';

        // Luôn chuyển sang ProductList với ?search=
        const targetUrl = `${base}pages/products/ProductList.html?search=${encodeURIComponent(keyword)}`;
        window.location.href = targetUrl;
    }

    function handleSearchKeyPress(event) {
        if (event.key === "Enter") {
            event.preventDefault();
            executeSearch();
        }
    }
</script>
<script>
    // Đồng bộ ô search với ?search= trên URL khi header được load
    (function syncSearchInput() {
        const params = new URLSearchParams(window.location.search);
        const kw = params.get("search");
        if (kw) {
            const input = document.getElementById("searchInput");
            if (input) input.value = kw;
        }
    })();
</script>
<script>
    document.addEventListener('cartReady', (e) => {
        const badge = document.getElementById('cart-badge-bg');
        const text = document.getElementById('cart-badge-text');
        if (!badge || !text) return;
        const total = e.detail;
        badge.style.display = total > 0 ? 'block' : 'none';
        text.style.display = total > 0 ? 'block' : 'none';
        text.textContent = total > 99 ? '99+' : total;
    });
</script>
